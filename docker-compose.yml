services:
  parking:
    build: .
    container_name: parking
    ports:
      - "5000:5000"
      - "5001:5001"
    environment:
      SECRET_KEY: ${SECRET_KEY:-parking-development-secret}
    volumes:
      - ./data:/app/data
      - ./exports:/app/exports
      - ./config.ini:/app/config.ini
    restart: unless-stopped
