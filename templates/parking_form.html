{% extends "base.html" %}
{% block title %}{% if parking %}Uredi parking{% else %}Dodaj parking{% endif %} · ParKING{% endblock %}
{% block content %}
<div class="form-card">
    <h2>{% if parking %}Uredi parking{% else %}Dodaj parking{% endif %}</h2>

    <form method="post" class="mt-4">
        <div class="mb-3">
            <label class="form-label">Naziv</label>
            <input class="form-control" name="name" value="{{ parking.name if parking else '' }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Lokacija</label>
            <input class="form-control" name="location" value="{{ parking.location if parking else '' }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Cijena po satu (€)</label>
            <input class="form-control" type="number" min="0" step="0.01" name="price_per_hour" value="{{ parking.price_per_hour if parking else '' }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Opis</label>
            <textarea class="form-control" rows="4" name="description">{{ parking.description if parking else '' }}</textarea>
        </div>
        <button class="btn btn-primary">Spremi</button>
        <a class="btn btn-secondary" href="{{ url_for('my_parkings') }}">Odustani</a>
    </form>
</div>
{% endblock %}
