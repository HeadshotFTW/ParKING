{% extends "base.html" %}
{% block title %}{{ tr('login.title') }} - ParKING{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <h1 class="h3 mb-3">{{ tr('login.title') }}</h1>
        <form method="post" class="card card-body">
            <label class="form-label">{{ tr('common.username') }}</label>
            <input class="form-control mb-3" name="username" required autofocus>
            <label class="form-label">{{ tr('common.password') }}</label>
            <input class="form-control mb-3" type="password" name="password" required>
            <button class="btn btn-primary">{{ tr('login.submit') }}</button>
        </form>
    </div>
</div>
{% endblock %}
