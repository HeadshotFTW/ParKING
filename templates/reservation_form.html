{% extends "base.html" %}
{% block title %}Rezervacija · ParKING{% endblock %}
{% block content %}
<div class="form-card">
    <h2>Rezervacija</h2>
    <p class="text-muted">{{ parking.name }} · {{ parking.location }} · {{ parking.display_price() }}</p>

    <form method="post">
        <div class="mb-3">
            <label class="form-label">Početak</label>
            <input class="form-control" type="datetime-local" name="start_time" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Završetak</label>
            <input class="form-control" type="datetime-local" name="end_time" required>
        </div>
        <button class="btn btn-primary">Rezerviraj</button>
    </form>
</div>
{% endblock %}
