{% extends "base.html" %}
{% block title %}{% if reservation %}Uredi rezervaciju{% else %}Dodaj rezervaciju{% endif %} · ParKING{% endblock %}
{% block content %}
<div class="form-card">
    <h2>{% if reservation %}Uredi rezervaciju{% else %}Dodaj rezervaciju{% endif %}</h2>
    <form method="post" class="mt-4">
        <div class="mb-3">
            <label class="form-label">Korisnik</label>
            <select class="form-select" name="user_id" required>
                {% for user in users %}
                    <option value="{{ user.id }}" {% if reservation and reservation.user_id == user.id %}selected{% endif %}>{{ user.username }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Parking</label>
            <select class="form-select" name="parking_id" required>
                {% for parking in parkings %}
                    <option value="{{ parking.id }}" {% if reservation and reservation.parking_id == parking.id %}selected{% endif %}>{{ parking.name }} — {{ parking.location }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Početak</label>
            <input class="form-control" type="datetime-local" name="start_time" value="{{ reservation.start_time.strftime('%Y-%m-%dT%H:%M') if reservation else '' }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Završetak</label>
            <input class="form-control" type="datetime-local" name="end_time" value="{{ reservation.end_time.strftime('%Y-%m-%dT%H:%M') if reservation else '' }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Status</label>
            <select class="form-select" name="status">
                <option value="ACTIVE" {% if not reservation or reservation.status == 'ACTIVE' %}selected{% endif %}>ACTIVE</option>
                <option value="CANCELLED" {% if reservation and reservation.status == 'CANCELLED' %}selected{% endif %}>CANCELLED</option>
            </select>
        </div>
        <button class="btn btn-primary">Spremi</button>
        <a class="btn btn-secondary" href="{{ url_for('admin_reservations') }}">Odustani</a>
    </form>
</div>
{% endblock %}
